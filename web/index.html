    <meta name="twitter:title" content="Tube Race: daily London transit puzzle" />

      name="twitter:description"
      content="A free daily London Underground navigation puzzle. Find the shortest route from a hidden start to the target."
    />

    <!-- Structured data: a free browser game. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "applicationCategory": "GameApplication",
        "name": "Tube Race",
        "url": "https://tube-race.isseikuzuki.co.uk/",

        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "GBP"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Tube Race is a free daily London Underground and tube navigation puzzle.
        Each day you race across the real London transit map from a hidden start
        station to a target, trying to reach it in the fewest stops and line
        changes. It runs entirely in your browser and needs JavaScript enabled
        to play. Unofficial; not affiliated with Transport for London.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
