name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check pipeline/
      - run: mypy pipeline/tube_pipeline/
      - run: pytest

  web:
    name: Web game
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
